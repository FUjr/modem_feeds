name: Publish Existing Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      source_run_id:
        description: Successful build workflow run containing all artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -eu
          mkdir -p releases
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir releases/artifacts
          find releases/artifacts -type f -print

      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tar -C releases/artifacts -czf "releases/qmodem-${RELEASE_TAG}.tar.gz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: false
          files: releases/qmodem-${{ inputs.tag }}.tar.gz
          generate_release_notes: false
